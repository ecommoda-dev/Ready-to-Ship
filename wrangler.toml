# الشكل المعتمد لأدوات EcomModa
# ⚠️ name لازم يطابق اسم الـ Worker في داشبورد Cloudflare حرف بحرف.
#    لو اختلفوا، الـ build مش بيفشل — بينشر Worker جديد والأصلي بيتجمّد بصمت.

name               = "ready-to-ship-worker"
main               = "index.js"
compatibility_date = "2025-01-01"
workers_dev        = true

[observability]
enabled = true

# ─── D1 ──────────────────────────────────────────────
# الأداة دي مالهاش D1 — الكود نفسه بيوثّق كده في الهيدر (لا login ولا audit log).
# مفيش env.DB في الكود، فمفيش [[d1_databases]] هنا عمدًا.

# ─── Vars (نص عادي — مش أسرار) ────────────────────────
# دي بتتطبّق فعليًا مع Workers Builds (اتأكدنا 22-08-2026).
# التحذير القديم "vars بتُتجاهل" مخصوص للرفع اليدوي من الداشبورد بس.
[vars]
SHOP_DOMAIN = "6c7e1a-53.myshopify.com"

# ─── KV (لو الأداة بتعمل caching) ─────────────────────
# [[kv_namespaces]]
# binding = "CACHE"
# id      = "<namespace-id>"

# ─── Cron (لو الأداة ليها مهمة مجدولة) ────────────────
# [triggers]
# crons = ["*/15 * * * *"]

# ⚠️ الأسرار مبتتكتبش هنا أبدًا.
#    Worker → Settings → Variables and Secrets → علّم Secret
#    وبعدها: Deployments → Version History → ⋯ → Promote version
#    الأسرار المطلوبة: WORKER_SECRET · CLIENT_ID · CLIENT_SECRET
